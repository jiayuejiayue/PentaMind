# PentaMind Platform - 服务器配置

server:
  port: 8080
  servlet:
    context-path: /

# PentaMind 平台自定义配置
pentamind:
  # 工具 YAML 描述文件目录（绝对路径，避免工作目录不同导致找不到工具）
  tools-dir: "E:/webSafe/AI_agent/PentaMind/platform/backend/tools/"
  
  # 远端 Python MCP 节点调度配置
  mcp:
    python-path: "D:/python/anaconda/python.exe"
    server-script: "E:/webSafe/AI_agent/PentaMind/platform/mcp-server/main.py"


spring:
  application:
    name: pentamind-platform
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/pentamind?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.pentamind.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  file:
    name: logs/pentamind.log
  level:
    com.pentamind: debug
    org.springframework: info

